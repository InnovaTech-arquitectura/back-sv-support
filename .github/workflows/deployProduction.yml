name: Deploy Spring Boot App to Production

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: [self-hosted, prod-support]  # Cambiar a prod-support

    steps:
    - name: Comprobando el repositorio
      uses: actions/checkout@v4

    - name: Configurar el agente SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY_PRODUCTION }}

    - name: Ejecutar el script de despliegue
      run: |
        ssh -o StrictHostKeyChecking=no estudiante@10.43.101.125 'bash -s' < ./deploy.sh production  # Cambiar IP a 10.43.101.125
      working-directory: ./  # Establece el directorio de trabajo a la raíz del repositorio

    - name: Comprobar estado de despliegue
      run: |
        ssh -o StrictHostKeyChecking=no estudiante@10.43.101.125 'docker ps'  # Cambiar IP a 10.43.101.125
